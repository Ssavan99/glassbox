name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual dispatch lets a deploy be verified from any branch before the
  # first merge to main (e.g. Phase 7's own acceptance check), and gives a
  # way to re-deploy on demand without a new commit.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export artifacts/ to web/public/data/
        # scripts/export_web.py touches engine.config plus pyyaml (to derive
        # questions.json from evaluation/questions.yaml, added in Phase 8) --
        # pyyaml alone, not the full project, keeps this step fast.
        run: |
          pip install pyyaml
          python scripts/export_web.py
      - name: Extract code excerpts from engine/ source
        # Must run after export_web.py, not before -- export_web.py clears
        # and recreates web/public/data/ on every run, so extracting first
        # would just get wiped. No extra deps (stdlib only): this is a pure
        # source-file read, never an LLM call, which is what lets the
        # tutorial pages' code excerpts be regenerated fresh on every build
        # instead of committed and risking drift from engine/.
        run: python scripts/extract_code_excerpts.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
