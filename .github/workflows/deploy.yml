name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual dispatch lets a deploy be verified from any branch before the
  # first merge to main (e.g. Phase 7's own acceptance check), and gives a
  # way to re-deploy on demand without a new commit.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export artifacts/ to web/public/data/
        # scripts/export_web.py only touches engine.config, which has zero
        # third-party imports -- no `pip install` needed for this step.
        run: python scripts/export_web.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
