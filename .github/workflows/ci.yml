name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Verify corpus
        run: python scripts/verify_corpus.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check web/ exists
        id: check
        run: echo "exists=$( [ -f web/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - name: Export artifacts/ to web/public/data/
        if: steps.check.outputs.exists == 'true'
        # scripts/export_web.py only touches engine.config, which has zero
        # third-party imports -- no `pip install` needed for this step.
        # Needed here (not just in deploy.yml) because web/src/lib/data.test.ts
        # reads the real exported JSON off disk.
        run: python scripts/export_web.py
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm ci
      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npx tsc --noEmit
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run test
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run build
