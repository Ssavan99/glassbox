[project]
name = "glassbox"
version = "0.1.0"
description = "See inside RAG — seven retrieval-augmented generation architectures, traced and taught."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "networkx>=3.2",
    "python-louvain>=0.16",
    "pyyaml>=6.0",
    "groq>=0.11",
    "ollama>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
